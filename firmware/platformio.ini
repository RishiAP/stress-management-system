; PlatformIO Project Configuration File
;
; ESP32 Firmware for NeuroSync Stress Management System
; Reads BVP (MAX30102), GSR (analog), Temperature (DS18B20)
; and POSTs 10-second windows to the Next.js /api/ingest endpoint.

[env:nodemcu-32s]
platform = espressif32
board = nodemcu-32s
framework = arduino
monitor_speed = 115200
lib_deps =
    https://github.com/tzapu/WiFiManager.git
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library
    milesburton/DallasTemperature
    paulstoffregen/OneWire
    bblanchon/ArduinoJson @ ^7
build_flags =
    -DARDUINO_ARCH_ESP32
