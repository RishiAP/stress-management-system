[project]
name = "ml-inference-service"
version = "1.0.0"
description = "ML inference microservice for stress detection"
requires-python = ">=3.10"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "numpy",
    "scipy",
    "scikit-learn",
    "joblib",
    "huggingface_hub",
    "xgboost",
    "lightgbm",
    "imbalanced-learn",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
