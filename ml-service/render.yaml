services:
  - type: web
    name: stress-ml-inference
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: HF_REPO_ID
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: API_KEY
        sync: false
    healthCheckPath: /health
